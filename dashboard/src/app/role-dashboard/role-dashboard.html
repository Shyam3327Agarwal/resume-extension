<div class="dashboard-layout">
  <!-- Navigation -->
  <nav class="top-nav glass-card">
    <div class="nav-content">
      <div class="brand">
        <div class="logo-sm">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM13 17H11V15H13V17ZM13 13H11V7H13V13Z"/></svg>
        </div>
        <span>CV Admin</span>
      </div>
      
      <div class="nav-links">
        <a routerLink="/roles" routerLinkActive="active" class="nav-link">
          <i class="icon">📁</i> Roles
        </a>
        <a routerLink="/settings" routerLinkActive="active" class="nav-link">
          <i class="icon">⚙️</i> Settings
        </a>
        <a routerLink="/admin" routerLinkActive="active" class="nav-link">
          <i class="icon">🛡️</i> Admin
        </a>
      </div>

      <div class="user-profile" (click)="auth.logout()">
        <img [src]="(auth.user$ | async)?.photoURL || 'https://ui-avatars.com/api/?name=User&background=8b5cf6&color=fff'" alt="Avatar">
        <span>Logout</span>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="content-area container">
    <header class="page-header animate-up">
      <div class="header-text">
        <h2>Job Roles</h2>
        <p>Manage and configure your recruitment requirements</p>
      </div>
      <button class="btn-modern btn-primary" (click)="openModal()">
        <span>+</span> New Role
      </button>
    </header>

    <div class="roles-grid">
      <div *ngIf="loading" class="loading-state">
        <div class="pulse-loader"></div>
        <p>Fetching roles...</p>
      </div>

      <div *ngIf="!loading && roles.length === 0" class="empty-state glass-card animate-up">
        <div class="empty-icon">📂</div>
        <h3>No roles found</h3>
        <p>Start by creating your first job role to begin evaluations.</p>
        <button class="btn-modern btn-secondary" (click)="openModal()">Create First Role</button>
      </div>

      <div class="role-card glass-card animate-up" *ngFor="let role of roles; let i = index" [style.animation-delay]="i * 0.1 + 's'">
        <div class="card-header">
          <span class="role-id">{{ role.id }}</span>
          <button class="delete-btn" (click)="deleteRole(role.id)" title="Delete Role">×</button>
        </div>
        <h3>{{ role.title }}</h3>
        <p class="role-jd">{{ role.jd }}</p>
        <div class="requirements-list">
          <span class="req-tag" *ngFor="let req of role.requirements">{{ req }}</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Add Modal -->
  <div class="modal-overlay" *ngIf="showAddModal" (click)="closeModal()">
    <div class="modal-content glass-card animate-up" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>Create New Role</h3>
        <button class="close-modal" (click)="closeModal()">×</button>
      </div>
      
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Role ID</label>
            <input type="text" class="form-input" [(ngModel)]="newRole.id" placeholder="e.g., senior-dev">
          </div>
          <div class="form-group">
            <label class="form-label">Job Title</label>
            <input type="text" class="form-input" [(ngModel)]="newRole.title" placeholder="e.g., Senior Frontend Engineer">
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Job Description</label>
          <textarea class="form-input" rows="4" [(ngModel)]="newRole.jd" placeholder="Describe the role..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Requirements (comma-separated)</label>
          <input type="text" class="form-input" [(ngModel)]="newRole.requirements" placeholder="Angular, Node.js, AWS, etc.">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-modern btn-secondary" (click)="closeModal()">Cancel</button>
        <button class="btn-modern btn-primary" (click)="saveRole()">Create Role</button>
      </div>
    </div>
  </div>
</div>
